[workspace]
resolver = "3"
members = ["crates/ccswap-core", "crates/ccswap-claude", "crates/ccswap-codex", "crates/ccswap", "crates/ccswap-test-fakes"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ashigirl96/ccswap"

[workspace.dependencies]
ccswap-core = { path = "crates/ccswap-core" }
ccswap-claude = { path = "crates/ccswap-claude" }
ccswap-codex = { path = "crates/ccswap-codex" }
serde_json = { version = "1", features = ["preserve_order"] }

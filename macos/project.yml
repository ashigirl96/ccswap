name: CcswapWidget
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
targets:
  CcswapWidget:
    type: app-extension
    platform: macOS
    sources: [CcswapWidget]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.ashigirl96.ccswap.widget
    info:
      path: CcswapWidget/Info.plist
      properties:
        CFBundleDisplayName: ccswap
        CFBundleShortVersionString: "$(CCSWAP_VERSION)"
        CFBundleVersion: "$(CCSWAP_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CcswapWidget/CcswapWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /.claude-swap-backup/widget/
